name: Validate phone and PC preview
on:
  push:
    branches: [feature/authority-responsive-preview]
    paths: [.github/workflows/preview-source.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/authority-responsive-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve checksum-verified source changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for sha in 412e0b81d34e7d2e1c284f215c5e71eb7acda38d 628ce5ed05a051ba236728feea9832ac2f9972ea 2f31bfbe9877a238fb4629742b61f9c92a3ebe0e 1f91d6fa5b55fea7a2054dea813eaebc6fc26864; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/transfer.bz2"
          done
          python3 - <<'PY'
          import bz2, hashlib, json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = bz2.decompress((temp/'transfer.bz2').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == '3faf45c3bb3a6eef1122ac4f4ab37572c9b25b11113ce9004ff9f607fde31948'
          (temp/'transfer.json').write_bytes(raw)
          data = json.loads(raw)
          def apply(root, entries):
              for item in entries:
                  rel = pathlib.PurePosixPath(item['path'])
                  assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
                  path = root/rel
                  assert path.resolve().is_relative_to(root.resolve())
                  if item['before'] is None:
                      assert not path.exists(), path
                      text = item['text']
                  else:
                      old = path.read_bytes()
                      assert hashlib.sha256(old).hexdigest() == item['before'], ('base mismatch', str(path))
                      text = old.decode('utf-8')
                      for start, end, replacement in reversed(item['edits']):
                          text = text[:start] + replacement + text[end:]
                  raw = text.encode('utf-8')
                  assert hashlib.sha256(raw).hexdigest() == item['after'], ('result mismatch', str(path))
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(raw)
          apply(pathlib.Path.cwd(), data['app'])
          subprocess.run(['git', 'add', '--', *[e['path'] for e in data['app']]], check=True)
          print('Verified and applied', len(data['app']), 'source files')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: implement authoritative multi-screen UNO and proportional card artwork"
          git push origin HEAD:feature/authority-responsive-preview
      - name: Reconstruct pinned companion fixture from immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' repos/GraphGiraffe/boardgame-playroom/releases/assets/615994793 > "$RUNNER_TEMP/legacy.html"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = (temp/'legacy.html').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '2140ecc9060c371853814756c175dc6ec75fbba2c5b8c16c39e4ebe6ee2b3dee'
          bundles, _ = json.JSONDecoder().raw_decode(raw.decode('utf-8').split('globalThis.PlayroomInstalledPacks = ', 1)[1])
          root = temp/'companion'
          for bundle in bundles:
              game = bundle['manifest']['id']
              assert game in ('uno','domino','durak','checkers','snakes')
              folder = root/'packs'/game
              folder.mkdir(parents=True, exist_ok=True)
              (folder/'manifest.json').write_text(json.dumps(bundle['manifest'], ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              for name, text in bundle['files'].items():
                  rel = pathlib.PurePosixPath(name)
                  assert not rel.is_absolute() and '..' not in rel.parts
                  path = folder/rel
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
          data = json.loads((temp/'transfer.json').read_bytes())
          for item in data['packs']:
              path = root/item['path']
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == item['before'], ('companion base mismatch', str(path))
              text = old.decode('utf-8')
              for start, end, replacement in reversed(item['edits']):
                  text = text[:start] + replacement + text[end:]
              result = text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['after'], path
              path.write_bytes(result)
          for path, expected in data['packHashes'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest() == expected, path
          for folder in (root/'packs').iterdir():
              manifest = json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
              text = '// Generated by build.py from manifest.json. Edit manifest.json instead.\n(function (root) {\n  \'use strict\';\n  root.PlayroomCatalog ||= {};\n  root.PlayroomCatalog['+json.dumps(manifest['id'])+'] = '+json.dumps(manifest, ensure_ascii=False, indent=2)+';\n})(globalThis);\n'
              (folder/'manifest.js').write_text(text, encoding='utf-8')
          print('Verified companion source hashes:', len(data['packHashes']))
          PY
      - name: Install locked test dependencies and Chromium
        run: bash scripts/codex/setup.sh --packs-dir "$RUNNER_TEMP/companion/packs" --install-system-deps
      - name: Independent application regression
        run: |
          set -o pipefail
          bash scripts/codex/check.sh 2>&1 | tee "$RUNNER_TEMP/independent-tests.log"
      - name: Full five-pack and native browser regression
        run: |
          set -o pipefail
          bash scripts/codex/check.sh --full --packs-dir "$RUNNER_TEMP/companion/packs" 2>&1 | tee "$RUNNER_TEMP/full-tests.log"
      - name: Build device test kit
        run: python3 dev/package-preview.py --packs-dir "$RUNNER_TEMP/companion/packs"
      - name: Upload preview and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-pc-preview
          path: |
            dist/preview/playroom-phone-pc-preview.zip
            dist/preview/playroom-all-games.html
            ${{ runner.temp }}/independent-tests.log
            ${{ runner.temp }}/full-tests.log
          retention-days: 14
