name: Current source artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: playroom-current-source
          path: dist/playroom-source.zip
          retention-days: 7
