name: Current source artifact
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: playroom-current-source
          path: dist/playroom-source.zip
          retention-days: 7
