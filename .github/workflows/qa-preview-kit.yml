name: Pinned phone-PC test kit
on:
  push:
    branches: [feature/phone-pc-preview]
    paths: [.github/workflows/qa-preview-kit.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19ca5106b772dde91f34f89687f01f25350d0125
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify exact companion sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for sha in 412e0b81d34e7d2e1c284f215c5e71eb7acda38d 628ce5ed05a051ba236728feea9832ac2f9972ea 2f31bfbe9877a238fb4629742b61f9c92a3ebe0e 1f91d6fa5b55fea7a2054dea813eaebc6fc26864; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/transfer.bz2"
          done
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/2877f54ecd3b3411c4e9f2440c60645359d93b5b" --jq .content | base64 --decode > "$RUNNER_TEMP/fixes.gz"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/45300f769c3158d2bf6fa136d5b040c3d58fa53e" --jq .content | base64 --decode > "$RUNNER_TEMP/final.gz"
          gh api -H 'Accept: application/octet-stream' repos/GraphGiraffe/boardgame-playroom/releases/assets/615994793 > "$RUNNER_TEMP/legacy.html"
          python3 - <<'PY'
          import bz2,gzip,hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=bz2.decompress((temp/'transfer.bz2').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='3faf45c3bb3a6eef1122ac4f4ab37572c9b25b11113ce9004ff9f607fde31948'
          original=json.loads(raw)
          raw=gzip.decompress((temp/'final.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='5349041ff49be7396855156911f468cb540b8f6065d33b7cf7899ff0a1708890'
          final=json.loads(raw)
          raw=(temp/'legacy.html').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2140ecc9060c371853814756c175dc6ec75fbba2c5b8c16c39e4ebe6ee2b3dee'
          bundles,_=json.JSONDecoder().raw_decode(raw.decode('utf-8').split('globalThis.PlayroomInstalledPacks = ',1)[1])
          root=temp/'companion'
          for bundle in bundles:
              game=bundle['manifest']['id'];assert game in ('uno','domino','durak','checkers','snakes')
              folder=root/'packs'/game;folder.mkdir(parents=True,exist_ok=True)
              (folder/'manifest.json').write_text(json.dumps(bundle['manifest'],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              for name,text in bundle['files'].items():
                  rel=pathlib.PurePosixPath(name);assert not rel.is_absolute() and '..' not in rel.parts
                  path=folder/rel;path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8')
          def apply(entries):
              for item in entries:
                  rel=pathlib.PurePosixPath(item['path']);assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
                  path=root/rel;old=path.read_bytes();assert hashlib.sha256(old).hexdigest()==item['before'],path
                  text=old.decode('utf-8')
                  for a,b,replacement in reversed(item['edits']):text=text[:a]+replacement+text[b:]
                  raw=text.encode('utf-8');assert hashlib.sha256(raw).hexdigest()==item['after'],path
                  path.write_bytes(raw)
          apply(original['packs'])
          for name,expected in original['packHashes'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          apply(json.loads(gzip.decompress((temp/'fixes.gz').read_bytes()))['packs'])
          apply(final['packs'])
          p=root/'packs/durak/styles.css';s=p.read_text(encoding='utf-8')
          a='gap:1px;top:5px!important;left:4px!important;right:auto!important;bottom:auto!important;font:850 16px/1'
          b='gap:0;top:5px!important;left:2px!important;right:auto!important;bottom:auto!important;font:850 13px/1'
          assert s.count(a)==1;s=s.replace(a,b)
          a='display:inline!important;font:850 12px/1 system-ui,sans-serif!important;margin:0!important'
          b='display:inline!important;font:850 10px/1 system-ui,sans-serif!important;margin:0!important'
          assert s.count(a)==1;s=s.replace(a,b)
          assert hashlib.sha256(s.encode('utf-8')).hexdigest()=='571421901e059800c399fc2489035b0a45481052a41eb2b9a101fa7e05b88d01'
          p.write_text(s,encoding='utf-8')
          for folder in (root/'packs').iterdir():
              manifest=json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
              text='// Generated by build.py from manifest.json. Edit manifest.json instead.\n(function (root) {\n  \'use strict\';\n  root.PlayroomCatalog ||= {};\n  root.PlayroomCatalog['+json.dumps(manifest['id'])+'] = '+json.dumps(manifest,ensure_ascii=False,indent=2)+';\n})(globalThis);\n'
              (folder/'manifest.js').write_text(text,encoding='utf-8')
          print('Exact five-pack production sources verified')
          PY
      - name: Install dependencies and Chromium
        run: bash scripts/codex/setup.sh --packs-dir "$RUNNER_TEMP/companion/packs" --install-system-deps
      - name: Independent application regression
        run: |
          set -o pipefail
          bash scripts/codex/check.sh 2>&1 | tee "$RUNNER_TEMP/independent-tests.log"
      - name: Full five-pack native browser regression
        run: |
          set -o pipefail
          bash scripts/codex/check.sh --full --packs-dir "$RUNNER_TEMP/companion/packs" 2>&1 | tee "$RUNNER_TEMP/full-tests.log"
      - name: Package verified phone and PC kit
        run: |
          python3 dev/package-preview.py --packs-dir "$RUNNER_TEMP/companion/packs"
          git archive --format=zip --output="$RUNNER_TEMP/reviewed-app-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-pc-preview-kit
          path: |
            dist/preview/playroom-phone-pc-preview.zip
            dist/preview/playroom-all-games.html
            ${{ runner.temp }}/independent-tests.log
            ${{ runner.temp }}/full-tests.log
            ${{ runner.temp }}/reviewed-app-source.zip
          retention-days: 14
