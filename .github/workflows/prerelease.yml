name: Release candidate build
on:
  workflow_dispatch:
    inputs:
      audit_scope:
        type: string
        default: full
      layout_audit:
        description: Capture a read-only layout audit of the verified preview
        type: boolean
        default: false
      operation:
        description: Build candidate or manually operate the existing Pages project
        type: choice
        options: [build, preflight, preview, deploy, rollback, verify-existing, activate-existing]
        default: build
      release:
        description: Published release tag for Pages deployment
        type: string
      pack_channel:
        description: Isolated pack catalog channel for preview only
        type: string
      packs_sha:
        description: Exact 40-character pack repository commit for a candidate build
        type: string
      checks:
        description: 'Required: none or selectors; all blocks: core,input,games,ui,storage,network,pairing'
        type: string
        required: true
      deployment:
        description: Production fallback/rollback ID, or existing preview ID for read-only preflight
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: multiplayer-prerelease-${{ github.event.pull_request.number || github.ref }}-${{ inputs.operation || 'build' }}
  cancel-in-progress: ${{ inputs.operation == 'build' || inputs.operation == '' }}
jobs:
  prerelease:
    if: inputs.operation == 'build' || inputs.operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - name: Checkout pinned shared project tools
        uses: actions/checkout@v4
        with:
          repository: GraphGiraffe/boardgame-playroom-utils
          ref: 25fc4b344dfdb21faea9115300b2739e3e71aff6
          ssh-key: ${{ secrets.PLAYROOM_UTILS_READ_KEY }}
          path: .playroom-utils
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Require an explicit test selection
        working-directory: app
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          [[ -n "$CHECKS" && "$CHECKS" != *" "* && "$CHECKS" != full && "$CHECKS" != all ]]
          case ",$CHECKS," in *,all,*|*,full,*) exit 2;; esac
          if [[ "$CHECKS" != none ]]; then node scripts/codex/test.cjs "$CHECKS" --list; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require an immutable companion commit
        env:
          PACKS_SHA: ${{ inputs.packs_sha }}
        run: '[[ "$PACKS_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: GraphGiraffe/boardgame-playroom-paks
          ref: ${{ inputs.packs_sha }}
          ssh-key: ${{ secrets.PLAYROOM_PAKS_READ_KEY }}
          path: companion
          persist-credentials: false
      - name: Prepare app with pinned source packs
        run: bash app/scripts/codex/setup.sh --packs-dir "$GITHUB_WORKSPACE/companion/packs"
      - name: Selected application checks
        if: inputs.checks != 'none'
        timeout-minutes: 25
        working-directory: app
        env:
          CHECKS: ${{ inputs.checks }}
        run: node scripts/codex/test.cjs "$CHECKS"
      - name: Source tests intentionally skipped
        if: inputs.checks == 'none'
        run: echo 'No source tests selected for this candidate; artifact build and SHA256 verification still run.'
      - name: Build release candidate artifacts
        run: |
          rm -rf app/dist/prerelease
          python3 app/build.py --packs-dir "$GITHUB_WORKSPACE/companion/packs" --all-games --pwa --remote-catalog --output-dir app/dist/prerelease
          (cd app/dist/prerelease && sha256sum -c SHA256SUMS)
          cp app/CHANGELOG.md app/dist/prerelease/CHANGELOG.md
          printf '%s\n' 'Playroom release candidate' "App head: ${GITHUB_SHA}" "Packs: API 4, pinned source commit ${PACKS_SHA}" "Checks: ${CHECKS}" 'Production PWA loads games from the protected catalog; the standalone HTML embeds the pinned collection.' > app/dist/prerelease/README-TEST.txt
        env:
          PACKS_SHA: ${{ inputs.packs_sha }}
          CHECKS: ${{ inputs.checks }}
      - uses: actions/upload-artifact@v4
        with:
          name: playroom-release-candidate
          path: app/dist/prerelease/
          retention-days: 30
  pages:
    if: inputs.operation != 'build' && inputs.operation != '' && inputs.checks == 'none'
    uses: ./.github/workflows/pages-deploy.yml
    with:
      checks: ${{ inputs.checks }}
      operation: ${{ inputs.operation }}
      release: ${{ inputs.release }}
      deployment: ${{ inputs.deployment }}
      pack_channel: ${{ inputs.pack_channel }}
      layout_audit: ${{ inputs.layout_audit }}
      audit_scope: ${{ inputs.audit_scope }}
    secrets: inherit
  reject_pages_test_selection:
    if: inputs.operation != 'build' && inputs.operation != '' && inputs.checks != 'none'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Pages operations do not run source tests; specify checks=none and use the verified release candidate.' >&2; exit 2
