name: Release candidate build
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build candidate or manually operate the existing Pages project
        type: choice
        options: [build, preflight, preview, deploy, rollback]
        default: build
      release:
        description: Published release tag for Pages deployment
        type: string
      packs_sha:
        description: Exact 40-character pack repository commit for a candidate build
        type: string
      deployment:
        description: Protected production fallback ID for deploy, or target for rollback
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: multiplayer-prerelease-${{ github.event.pull_request.number || github.ref }}-${{ inputs.operation || 'build' }}
  cancel-in-progress: ${{ inputs.operation == 'build' || inputs.operation == '' }}
jobs:
  prerelease:
    if: inputs.operation == 'build' || inputs.operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require an immutable companion commit
        env:
          PACKS_SHA: ${{ inputs.packs_sha }}
        run: '[[ "$PACKS_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: GraphGiraffe/boardgame-playroom-paks
          ref: ${{ inputs.packs_sha }}
          ssh-key: ${{ secrets.PLAYROOM_PAKS_READ_KEY }}
          path: companion
          persist-credentials: false
      - name: Prepare app with pinned source packs
        run: bash app/scripts/codex/setup.sh --packs-dir "$GITHUB_WORKSPACE/companion/packs"
      - name: Full application and pack checks
        timeout-minutes: 25
        run: bash app/scripts/codex/check.sh --full --packs-dir "$GITHUB_WORKSPACE/companion/packs"
      - name: Build tested all-games artifacts
        run: |
          rm -rf app/dist/prerelease
          python3 app/build.py --packs-dir "$GITHUB_WORKSPACE/companion/packs" --all-games --pwa --remote-catalog --output-dir app/dist/prerelease
          cp app/CHANGELOG.md app/dist/prerelease/CHANGELOG.md
          printf '%s\n' 'Playroom release candidate' "App head: ${GITHUB_SHA}" "Packs: API 1/2, pinned source commit ${PACKS_SHA}" 'Production PWA loads games from the protected catalog; the standalone HTML embeds the pinned collection.' > app/dist/prerelease/README-TEST.txt
        env:
          PACKS_SHA: ${{ inputs.packs_sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: playroom-release-candidate
          path: app/dist/prerelease/
          retention-days: 30
  pages:
    if: inputs.operation != 'build' && inputs.operation != ''
    uses: ./.github/workflows/pages-deploy.yml
    with:
      operation: ${{ inputs.operation }}
      release: ${{ inputs.release }}
      deployment: ${{ inputs.deployment }}
    secrets: inherit
