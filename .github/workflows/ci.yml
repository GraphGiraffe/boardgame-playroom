name: Application checks
on:
  pull_request:
    branches: [dev, main]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the same tools as Codex Cloud
        run: bash scripts/codex/setup.sh
      - name: Check the independent application
        run: bash scripts/codex/check.sh
