name: Application checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared project tools
        uses: actions/checkout@v4
        with:
          repository: GraphGiraffe/boardgame-playroom-utils
          ref: 43e8c44e1725520c7f479906c2a29fc6e7086a99
          ssh-key: ${{ secrets.PLAYROOM_UTILS_READ_KEY }}
          path: .playroom-utils
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the same tools as Codex Cloud
        run: bash scripts/codex/setup.sh
      - name: Check the independent application
        run: bash scripts/codex/check.sh
