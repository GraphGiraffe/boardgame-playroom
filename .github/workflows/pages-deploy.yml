name: Protected Pages publication
on:
  workflow_call:
    inputs:
      audit_scope:
        type: string
        default: full
      layout_audit:
        type: boolean
        default: false
      checks:
        type: string
        required: true
      pack_channel:
        type: string
        default: ''
      operation:
        type: string
        required: true
      release:
        type: string
        default: ''
      deployment:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      audit_scope:
        type: string
        default: full
      layout_audit:
        type: boolean
        default: false
      checks:
        description: 'Publication uses already verified assets; explicitly select none'
        type: string
        required: true
      operation:
        type: choice
        options: [deploy, preview, rollback, preflight, verify-existing, activate-existing]
        default: deploy
        required: true
      pack_channel:
        description: Isolated pack catalog channel for preview only
        type: string
      release:
        description: Published release tag (for deploy)
        type: string
      deployment:
        description: Production fallback/rollback ID, or existing preview ID for read-only preflight
        type: string
permissions:
  contents: read
concurrency:
  group: protected-pages-production
  cancel-in-progress: false
jobs:
  publish:
    # PR readiness checks only inspect the existing site; publication is manual.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH }}
      CLOUDFLARE_PAGES_ORIGIN: ${{ vars.CLOUDFLARE_PAGES_ORIGIN }}
      PAGES_PRIVATE_WRAPPER_B64: ${{ secrets.PAGES_PRIVATE_WRAPPER_B64 }}
      PAGES_SMOKE_PASSWORD: ${{ secrets.PAGES_SMOKE_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Require explicit publication check selection
        env:
          CHECKS: ${{ inputs.checks }}
        run: test "$CHECKS" = none || { echo 'Select checks=none; source checks belong to the candidate build.' >&2; exit 2; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned shared project tools
        uses: actions/checkout@v4
        with:
          repository: GraphGiraffe/boardgame-playroom-utils
          ref: 25fc4b344dfdb21faea9115300b2739e3e71aff6
          ssh-key: ${{ secrets.PLAYROOM_UTILS_READ_KEY }}
          path: .playroom-utils
          persist-credentials: false
      - name: Require recovery support in pinned tools
        if: inputs.operation == 'verify-existing' || inputs.operation == 'activate-existing'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 .playroom-utils/tools/app/pages-deploy.py --help > /tmp/pages-help.txt
          grep -F -- "$OPERATION" /tmp/pages-help.txt > /dev/null || { echo 'Pinned utils does not support recovery; update to a reviewed immutable utils commit before dispatch.' >&2; exit 2; }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: bash scripts/codex/setup.sh
      - name: Verify and publish, or rollback
        env:
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preflight' }}
          RELEASE: ${{ inputs.release }}
          DEPLOYMENT: ${{ inputs.deployment }}
          PACK_CHANNEL: ${{ inputs.pack_channel }}
        run: python3 scripts/pages-deploy.py "$OPERATION" --release "$RELEASE" --deployment "$DEPLOYMENT" --pack-channel "$PACK_CHANNEL"
      - name: Audit verified preview layouts without deployment
        if: inputs.layout_audit && inputs.operation == 'preflight'
        env:
          PLAYROOM_AUDIT_SCOPE: ${{ inputs.audit_scope }}
        run: node scripts/pages-layout-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.layout_audit
        with:
          name: pages-layout-audit
          path: dist/pages-layout-audit/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-deployment-report
          path: deploy-report.json
          if-no-files-found: ignore
