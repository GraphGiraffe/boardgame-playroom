name: Prune merged RC6 feature/fix branches (one-off)
on:
  push:
    branches: [chore/rc6-dev-baseline]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: rc6-once-prune-merged-branches
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'GraphGiraffe/boardgame-playroom' && github.ref == 'refs/heads/chore/rc6-dev-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged PR, open PRs, exact ref SHA, then delete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          repo='GraphGiraffe/boardgame-playroom'
          assert os.environ.get('GITHUB_REPOSITORY')==repo
          assert os.environ.get('GITHUB_REF')=='refs/heads/chore/rc6-dev-baseline'
          token=os.environ.get('GH_TOKEN')
          if not token: raise RuntimeError('Missing GitHub Actions token')
          candidates=[
              (1, "feature/independent-game-packs", "e3a45701d3806251ac926146512a040a7b4bffee"),
              (3, "chore/codex-cloud", "0796d653ab95be5d055957306c3094575a0a983e"),
              (6, "docs/unified-web-app-plan", "2097b4926103b977f2713add4e5d6535b9fed8f9"),
              (8, "docs/browser-only-multiplayer", "b2983c48b4befa24a5416bb4e18a9dbee5dfdb67"),
              (12, "ci/on-demand-actions", "d88da071dfe646e3a0a4715318aa1abfc316fc89"),
              (17, "fix/unified-gameflow-overflow-release-check", "835f0f758bd53d77fe5790c81fe16bd6fcccadea"),
              (18, "docs/playroom-015x-roadmap-20261008", "38cc6a265f0e25393b494efbd394fffef61f2510"),
              (19, "feature/rc2-acoustic-pairing", "8dc039cb5bc6c20798fb2bd8733adae9e0ad399f"),
              (20, "fix/acoustic-ip-candidates-vpn", "de32b3f073ab086669f7e7c9a152fa1b7970c10d"),
              (21, "fix/rc4-network-address-selection", "987f4aca4bfe4be557d279aad62b640d262c3501"),
              (22, "fix/rc5-acoustic-permission-and-addresses", "1186e82ab94f31f423cb1b447d9f030a941ea601"),
              (23, "feature/rc6-qr-scanner-secure-resume", "4fe4cf78d962268143ed030676f49dd2d428e000"),
              (24, "docs/rc6-developer-reference", "ee8c3bb1cc7df3711e4e53ed4d2cf5142716d491"),
          ]
          def req(endpoint,method='GET'):
              url='https://api.github.com/repos/'+repo+'/'+endpoint
              request=urllib.request.Request(url,method=method,headers={
                'Authorization':'Bearer '+token,
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28',
                'User-Agent':'PlayRoom-safe-branch-prune'
              })
              with urllib.request.urlopen(request,timeout=20) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          # Never delete a branch used by an open PR.
          open_heads=set()
          for page in range(1,6):
              pulls=req('pulls?state=open&per_page=100&page='+str(page))
              open_heads.update(p['head']['ref'] for p in pulls if p['head']['repo'] and p['head']['repo']['full_name']==repo)
              if len(pulls)<100:break
          deleted=[];skipped=[]
          for number,name,sha in candidates:
              assert name.split('/')[0] in {'feature','fix','docs','chore','ci'}
              assert name not in {'dev','main','chore/rc6-dev-baseline'}
              if name in open_heads:
                  skipped.append((name,'open PR'));continue
              pr=req('pulls/'+str(number))
              if not pr.get('merged_at') or pr['head']['ref']!=name or pr['head']['sha']!=sha:
                  skipped.append((name,'merged PR ref/head mismatch'));continue
              try:br=req('branches/'+urllib.parse.quote(name,safe='/'))
              except urllib.error.HTTPError as e:
                  if e.code==404:skipped.append((name,'already deleted'));continue
                  raise
              if br['protected'] or br['commit']['sha']!=sha:
                  skipped.append((name,'protected or head moved'));continue
              try:
                  req('git/refs/heads/'+urllib.parse.quote(name,safe='/'),'DELETE')
                  deleted.append(name)
                  print('DELETED',name)
              except urllib.error.HTTPError as e:
                  skipped.append((name,'HTTP '+str(e.code)))
                  print('SKIPPED',name,'HTTP',e.code)
          print('DELETED COUNT',len(deleted))
          print('SKIPPED COUNT',len(skipped))
          for name,reason in skipped:print('SKIPPED',name,reason)
          PY
