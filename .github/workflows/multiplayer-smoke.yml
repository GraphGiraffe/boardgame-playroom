name: Multiplayer preview smoke
on:
  pull_request:
    branches: [dev]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: multiplayer-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned tested packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pinned
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/GraphGiraffe/boardgame-playroom/actions/artifacts/11459727753/zip" -o pinned/old.zip
          unzip -q pinned/old.zip -d pinned/old
          unzip -q pinned/old/boardgame-playroom/boardgame-playroom/dist/preview/playroom-phone-pc-preview.zip -d pinned/kit
          mkdir -p pinned/bundles pinned/sourcepacks
          cp pinned/kit/playroom-preview/preview-packs/*.playroom-pack.json pinned/bundles/
          python3 - <<'PY'
          import json
          from pathlib import Path
          for bp in Path('pinned/bundles').glob('*.playroom-pack.json'):
              b=json.loads(bp.read_text(encoding='utf-8')); m=b['manifest']; root=Path('pinned/sourcepacks')/m['id']; root.mkdir(parents=True,exist_ok=True)
              (root/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              (root/'manifest.js').write_text("// smoke generated\n(function(root){root.PlayroomCatalog||={};root.PlayroomCatalog["+json.dumps(m['id'])+"]="+json.dumps(m,ensure_ascii=False)+";})(globalThis);\n",encoding='utf-8')
              for name,value in b['files'].items():
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8')
          PY
      - name: Prepare bundled games
        run: bash app/scripts/codex/setup.sh --packs-dir "$GITHUB_WORKSPACE/pinned/sourcepacks"
      - name: Legacy layout regression gate
        working-directory: app
        timeout-minutes: 4
        run: node --test --test-concurrency=1 tests/checkers-drag.test.cjs tests/uno-hand-size.test.cjs tests/compact-hand.test.cjs
      - name: Two-device release gate
        working-directory: app
        run: node --test --test-concurrency=1 tests/multiplayer-lobby.test.cjs tests/webrtc-browser.test.cjs tests/acoustic-webrtc-browser.test.cjs tests/qr-pairing-browser.test.cjs tests/pairing-methods-browser.test.cjs tests/network-resume.test.cjs tests/network-next-match.test.cjs tests/network-client-history-browser.test.cjs tests/pwa-share.test.cjs tests/network-reconnect-browser.test.cjs tests/network-host-recovery-browser.test.cjs tests/network-main-app.test.cjs tests/network-same-origin.test.cjs tests/recovery-warning.test.cjs tests/network-feedback-browser.test.cjs tests/unified-game-screen-browser.test.cjs tests/ui.test.cjs tests/lobby-layout-browser.test.cjs tests/history-library-layout-browser.test.cjs
      - name: Build all-games preview
        run: |
          rm -rf app/dist/smoke
          python3 app/build.py --packs-dir "$GITHUB_WORKSPACE/pinned/sourcepacks" --all-games --pwa --output-dir app/dist/smoke
          test -s app/dist/smoke/pwa/app/vendor/qrcode.js
          test -s app/dist/smoke/pwa/app/vendor/jsqr.js
          test -s app/dist/smoke/pwa/app/vendor/LICENSE.qrcode
          test -s app/dist/smoke/pwa/app/vendor/LICENSE.jsqr
          rm -f app/dist/smoke/playroom-pwa.zip
          (
            cd app/dist/smoke
            zip -q -r playroom-pwa.zip pwa
          )
          # Final RC2 candidate artifact, including all modified assets and notices.
          cp app/dist/smoke/playroom-all-games.html app/dist/smoke/playroom-0.15.0-rc.2.html
          cp app/dist/smoke/playroom-pwa.zip app/dist/smoke/playroom-pwa-0.15.0-rc.2.zip
          cp app/CHANGELOG.md app/dist/smoke/CHANGELOG.md
          printf '%s\n' 'Playroom 0.15.0-rc.2' "App head: ${GITHUB_SHA}" \
            'LAN acoustic pairing: audible ggwave Fastest/Fast/Normal and manual IPv4 fallback.' \
            'QR / Share / paste remain fallback; physical Windows/Android and Safari acceptance pending.' \
            'Reconnect and network history persistence remain outside RC2 scope.' > app/dist/smoke/README-TEST.txt
          (
            cd app/dist/smoke
            zip -q playroom-0.15.0-rc.2-bundle.zip playroom-0.15.0-rc.2.html playroom-pwa-0.15.0-rc.2.zip README-TEST.txt CHANGELOG.md
            sha256sum playroom.html playroom-source.zip tabletop-core.zip playroom-all-games.html playroom-pwa.zip playroom-0.15.0-rc.2.html playroom-pwa-0.15.0-rc.2.zip playroom-0.15.0-rc.2-bundle.zip > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          unzip -tq app/dist/smoke/playroom-pwa.zip
      - name: Validate built file preview
        working-directory: app
        env:
          PLAYROOM_URL: file://${{ github.workspace }}/app/dist/smoke/playroom-all-games.html
        run: node --test --test-concurrency=1 tests/network-main-app.test.cjs
      - name: Validate installable PWA preview
        working-directory: app
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist/smoke/pwa >/tmp/playroom-pwa.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          PLAYROOM_URL=http://127.0.0.1:4174/ node --test --test-concurrency=1 tests/network-main-app.test.cjs
          curl --fail http://127.0.0.1:4174/manifest.webmanifest >/dev/null
          curl --fail http://127.0.0.1:4174/app/vendor/qrcode.js >/dev/null
          curl --fail http://127.0.0.1:4174/app/vendor/jsqr.js >/dev/null
          rm -rf /tmp/playroom-pwa-zip && mkdir -p /tmp/playroom-pwa-zip
          unzip -q dist/smoke/playroom-pwa.zip -d /tmp/playroom-pwa-zip
          test -s /tmp/playroom-pwa-zip/pwa/app/vendor/qrcode.js
          test -s /tmp/playroom-pwa-zip/pwa/app/vendor/ggwave.js
          test -s /tmp/playroom-pwa-zip/pwa/app/vendor/LICENSE.ggwave
          grep -F "app/vendor/qrcode.js" /tmp/playroom-pwa-zip/pwa/app/qr.js >/dev/null
          grep -F "app/vendor/qrcode.js" /tmp/playroom-pwa-zip/pwa/sw.js >/dev/null
          test -s /tmp/playroom-pwa-zip/pwa/app/vendor/jsqr.js
          test -s /tmp/playroom-pwa-zip/pwa/app/qr-scanner.js
          test -s /tmp/playroom-pwa-zip/pwa/app/vendor/LICENSE.jsqr
      - uses: actions/upload-artifact@v4
        with:
          name: playroom-0.15.0-rc.2
          path: app/dist/smoke/
          retention-days: 30
