name: Publish Playroom 0.15.0 preview
on:
  push:
    branches:
      - release/publish-v0.15.0-preview.1
  pull_request:
    branches: [dev]
    types: [opened, reopened]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'push' || github.head_ref == 'release/publish-v0.15.0-preview.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v0.15.0-preview.1
      TARGET_SHA: 9edceb68214195ed2e411c541975dae9211e362f
      ARTIFACT_ID: "11473542687"
      RELEASE_NAME: Playroom 0.15.0-preview.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check existing release
        id: existing
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified preview artifact
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p artifact release
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -s artifact/playroom-all-games.html
          test -s artifact/README-TEST.txt
          cp artifact/playroom-all-games.html release/playroom-0.15.0-preview.1.html
          (
            cd artifact
            zip -q -r ../release/playroom-0.15.0-preview.1.zip .
          )
          (
            cd release
            sha256sum playroom-0.15.0-preview.1.html playroom-0.15.0-preview.1.zip > SHA256SUMS.txt
          )

      - name: Prepare release notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Playroom 0.15.0-preview.1

          Первый pre-release для живого теста browser-to-browser multiplayer на двух устройствах.

          ### Что уже работает

          - одно основное web-приложение на ПК, телефоне и планшете;
          - имя игрока и название комнаты;
          - режимы **Сеть · Игрок** и **Сеть · Стол**;
          - места игроков и зрителей;
          - Ready / снятие Ready;
          - 3-секундный обратный отсчёт;
          - WebRTC DataChannel без отдельного PC-host приложения или Node-сервера;
          - ручной offer → answer pairing;
          - переход из лобби в общую SessionAuthority;
          - минимальная двухустройственная партия UNO и синхронизация ходов.

          ### Проверено

          Frozen source branch: `prerelease/0.15.0-preview.1`

          Source commit:
          `9edceb68214195ed2e411c541975dae9211e362f`

          Pinned packs:
          `b01652e56c70ff180f2fdde8da2f11ba115534fe`

          Проверки на этом commit:

          - Application checks #63 — success;
          - Multiplayer preview smoke #28 — success;
          - две независимые browser-сессии проходят pairing → lobby → seat → Ready → countdown → UNO → синхронный ход;
          - тот же сценарий проверен на готовом автономном `playroom-all-games.html` через `file://`.

          Проверенный CI artifact:
          `11473542687`

          Artifact SHA-256:
          `aad5b0b940a5dbed6121aa375daf9bc6960745a4b158cafa5af234330522e0f1`

          ### Как тестировать

          1. Скачайте `playroom-0.15.0-preview.1.html` на оба устройства.
          2. Откройте файл в браузере на обоих устройствах.
          3. На хосте: **UNO → Сеть · Игрок → создать комнату → Подключить устройство**.
          4. Передайте приглашение второму устройству.
          5. На клиенте: **Присоединиться к комнате** → вставьте приглашение → скопируйте ответ.
          6. Вставьте ответ на хосте.
          7. Клиент выбирает игровой слот.
          8. Оба игрока нажимают Ready, хост запускает игру.
          9. Проверьте несколько ходов на обоих устройствах.

          ### Известные ограничения preview

          - reconnect пока нет;
          - долговечный локальный архив сетевой истории пока не реализован;
          - QR, LAN discovery и короткий room code как первичный способ подключения пока не реализованы;
          - pairing в этой версии выполняется copy/paste;
          - физическая проверка разных браузеров и мобильных ОС продолжается.

          Это **pre-release**, не стабильная версия.
          EOF

      - name: Publish pre-release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "$RELEASE_NAME"             --notes-file release-notes.md             --prerelease             "release/playroom-0.15.0-preview.1.html#Playroom 0.15.0 preview — all games HTML"             "release/playroom-0.15.0-preview.1.zip#Playroom 0.15.0 preview — full bundle"             "release/SHA256SUMS.txt#SHA-256 checksums"

      - name: Verify published release
        shell: bash
        run: |
          gh release view "$TAG"             --repo "$GITHUB_REPOSITORY"             --json url,tagName,isPrerelease,name,targetCommitish,assets > release-view.json
          cat release-view.json
          python3 - <<'PY'
          import json
          data=json.load(open('release-view.json',encoding='utf-8'))
          assert data['tagName']=='v0.15.0-preview.1', data
          assert data['isPrerelease'] is True, data
          names={a['name'] for a in data.get('assets',[])}
          required={'playroom-0.15.0-preview.1.html','playroom-0.15.0-preview.1.zip','SHA256SUMS.txt'}
          assert required <= names, (required, names)
          print(data['url'])
          PY
