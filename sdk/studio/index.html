<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="sdk-token" content="{{TOKEN}}"><title>PlayRoom · Просмотр игры</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/notices.css"><link rel="stylesheet" href="/sdk-scene.css"><link rel="stylesheet" href="/view-kit.css"><link rel="stylesheet" href="/game-components.css"><link rel="stylesheet" href="/solitaire-board.css"><link rel="stylesheet" href="/elemental-arena.css"><link rel="stylesheet" href="/input.css"><link rel="stylesheet" href="/player-target.css"><script defer src="/messages.js"></script><script defer src="/localization.js"></script><script defer src="/player-target.js"></script><script defer src="/icons.js"></script><script defer src="/standard-sounds.js"></script><script defer src="/audio.js"></script><script defer src="/plan-player.js"></script><script defer src="/scheduler.js"></script><script defer src="/vector-art.js"></script><script defer src="/token-layout.js"></script><script defer src="/component-assets.js"></script><script defer src="/game-components.js"></script><script defer src="/solitaire-board.js"></script><script defer src="/elemental-arena.js"></script><script defer src="/mini-split-deck.js"></script><script defer src="/color-value-deck.js"></script><script defer src="/input.js"></script><script defer src="/player-palette.js"></script><script defer src="/progress-surface.js"></script><script defer src="/expandable-notice.js"></script><script defer src="/sdk-canvas.js"></script><script defer src="/protocol.js"></script><script defer src="/scene-images.js"></script><script defer src="/sdk-scene.js"></script><script defer src="/studio.js"></script></head>
<body class="sdk-preview{{STUDIO_CLASS}}">
<header class="preview-toolbar" aria-label="Просмотр игры">
 <span id="identity"></span>
 <label class="viewer-label">Зритель <select id="viewer"><option value="-1">Наблюдатель</option></select></label>
 <nav class="history-toolbar" aria-label="История">
  <button id="history-prev" data-icon="prev" aria-label="Предыдущее состояние"></button>
  <span id="history-status"></span>
  <button id="history-next" data-icon="next" aria-label="Следующее состояние"></button>
  <button id="history-live">К игре</button>
 </nav>
 <label><input id="mute" type="checkbox" checked>Без звука</label>
 <label><input id="motion" type="checkbox">Без движения</label>
 <button id="theme" data-icon="palette" aria-label="Сменить тему"></button>
 {{STUDIO_TOOLBAR}}
 <span id="connection" class="sr-only" role="status"></span>
</header>
<output id="error" role="alert" hidden></output>
<main class="preview-workspace">
 <div class="preview-viewport" id="preview-viewport"><iframe id="scene" src="/viewer.html" title="Игровой экран" allow="fullscreen"></iframe></div>
 {{STUDIO_PANEL}}
</main>
{{STUDIO_SCRIPT}}
</body></html>
